name: Install & Smoke Test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: install-smoke-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify package builds
        run: npm pack

      - name: Initialize Worklog
        run: |
          node ./dist/cli.js init --project-name "ContextHub" --prefix WL --agents-template skip --json > /dev/null
          echo "✓ Worklog initialized"

      - name: Run headless smoke test
        run: |
          # Verify the wl command is available and works
          node ./dist/cli.js list -n 1 --json > /dev/null
          echo "✓ wl CLI works"

          # Verify the Pi extension entry point and retained agent-side modules load
          # without errors (using tsx for TypeScript imports)
          npx tsx -e "
          (async () => {
            const { createWorklogPiExtension } = await import('./packages/tui/extensions/Worklog/index.ts');
            if (typeof createWorklogPiExtension !== 'function') throw new Error('createWorklogPiExtension is not a function');
            const { runWl } = await import('./packages/tui/extensions/wl-integration.ts');
            const { INSTALL_GUARDRAILS } = await import('./packages/tui/extensions/Worklog/lib/guardrails.ts');
            const { registerSkillPathTool } = await import('./packages/tui/extensions/Worklog/lib/skill-path.ts');
            const { registerLeaseRelease } = await import('./packages/tui/extensions/Worklog/lease-release.ts');
            console.log('✓ Pi extension modules load successfully');
          })();
          "

          # Verify the extension registers its feature modules (dry run, no pi runtime)
          npx tsx -e "
          (async () => {
            const { createWorklogPiExtension } = await import('./packages/tui/extensions/Worklog/index.ts');
            const registered: string[] = [];
            const piStub = {
              on: () => {}, registerCommand: () => {}, registerTool: () => {},
              ui: { setStatus: () => {}, setFooter: () => {}, notify: () => {} },
            };
            const register = createWorklogPiExtension();
            register(piStub);
            console.log('✓ Extension registers without errors');
          })();
          "

          # Verify pi-audit module works
          node -e "
            const { runPiAudit } = require('./dist/pi-audit.js');
            console.log('✓ Pi-audit module loads');
          "

          echo "All smoke tests passed"

      - name: Run full test suite
        run: npm test
