name: Worklog

on:
  pull_request:

concurrency:
  group: cli-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - 'package.json'
              - 'package-lock.json'
              - 'vitest.config.ts'
              - '.github/workflows/**'
            cli:
              - 'src/cli.ts'
              - 'src/commands/**'
              - 'src/utils/**'
              - 'src/database.ts'
              - 'src/jsonl.ts'
              - 'src/sync/**'
              - 'src/github*.ts'
              - 'src/types.ts'
              - 'src/index.ts'
              - 'tests/**/*.test.ts'
              - 'test/**/*.test.ts'

  docs-only:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.cli != 'true' && needs.changes.outputs.shared != 'true' }}
    steps:
      - name: No test changes detected
        run: echo "Docs-only change; skipping CLI test jobs."

  cli-tests:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' || needs.changes.outputs.shared == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      - name: Initialize Worklog
        run: |
          node ./dist/cli.js init --project-name "ContextHub" --prefix WL --agents-template skip --json > /dev/null
          echo "✓ Worklog initialized"

      - name: Run CLI tests
        run: npm test
