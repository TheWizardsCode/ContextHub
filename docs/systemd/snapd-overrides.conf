# Systemd override for snapd service watchdog
#
# This file should be installed via:
#   sudo mkdir -p /etc/systemd/system/snapd.service.d
#   sudo cp snapd-watchdog-overrides.conf /etc/systemd/system/snapd.service.d/
#   sudo systemctl daemon-reload
#   sudo systemctl restart snapd.service
#
# Work Item: WL-0MT1KJNHE0048HW3
#
# Rationale: snapd 2.76.2 contains a udev monitor goroutine hang bug
# (select without timeout on udev netlink socket). Disabling the systemd
# watchdog prevents the forced SIGABRT that contributes to cascading freezes.
#
# Trade-off: If snapd hangs, it will not be auto-recovered by watchdog.
# Systemd Restart=on-failure policy still applies.
#
# See: docs/dev/snapd-udev-monitor-hang-investigation.md

[Service]
WatchdogSec=0
