# Manifest for worklog-selection-list — Worklog work item browser for Herdr
#
# Provides a keyboard-navigable work item selection list pane that lets
# users browse, filter, and select Worklog work items from within Herdr.
# Uses the `wl` CLI as the backend data source.

id = "worklog-selection-list"
name = "Worklog Selection List"
version = "0.1.0"
description = "Browse, filter, and select Worklog work items from a Herdr pane. Keyboard-navigable list with stage/priority filtering and detail view."
min_herdr_version = "0.7.0"
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["npm", "run", "build"]

# Pane: work item selection list
[[panes]]
id = "worklist"
title = "Work Items"
placement = "tab"
command = ["npx", "tsx", "src/index.ts"]

# Main action: toggle the worklist pane
[[actions]]
id = "toggle-worklist"
title = "Toggle worklist"
description = "Open the Worklog work item selection pane (focus it if open; close it if focused)."
command = ["bash", "scripts/toggle.sh"]

# Action: open worklist pane directly
[[actions]]
id = "open-worklist"
title = "Open worklist"
description = "Open the Worklog work item selection pane."
command = ["bash", "scripts/open.sh"]

# Action: open the worklog tab (worklist pane renamed to "Worklog")
[[actions]]
id = "open-podcast-editor-tab"
title = "Open Worklog tab"
description = "Open the Worklog work item selection pane in a new tab renamed to 'Worklog'."
command = ["bash", "scripts/open-podcast-editor-tab.sh"]

# Action: open pi agent pane
[[actions]]
id = "open-pi-agent"
title = "Open Pi Agent"
description = "Open a Pi AI coding agent pane docked on the right."
command = ["bash", "scripts/open-pi-agent.sh"]
